<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="VCA Live 3D Animated CAD Specification VCA-26-00202">
  <defs>
    <style>
      
      @keyframes vcaLayer0 {
        0%, 10% { transform: translate(-17.3px, 6.2px); }
        34%, 68% { transform: translate(-108.0px, 39.0px); }
        90%, 100% { transform: translate(-17.3px, 6.2px); }
      }
      .vca-l0 { animation: vcaLayer0 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer1 {
        0%, 10% { transform: translate(-11.5px, 4.2px); }
        34%, 68% { transform: translate(-72.0px, 26.0px); }
        90%, 100% { transform: translate(-11.5px, 4.2px); }
      }
      .vca-l1 { animation: vcaLayer1 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer2 {
        0%, 10% { transform: translate(-5.8px, 2.1px); }
        34%, 68% { transform: translate(-36.0px, 13.0px); }
        90%, 100% { transform: translate(-5.8px, 2.1px); }
      }
      .vca-l2 { animation: vcaLayer2 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer3 {
        0%, 10% { transform: translate(0.0px, 0.0px); }
        34%, 68% { transform: translate(0.0px, 0.0px); }
        90%, 100% { transform: translate(0.0px, 0.0px); }
      }
      .vca-l3 { animation: vcaLayer3 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer4 {
        0%, 10% { transform: translate(5.8px, -2.1px); }
        34%, 68% { transform: translate(36.0px, -13.0px); }
        90%, 100% { transform: translate(5.8px, -2.1px); }
      }
      .vca-l4 { animation: vcaLayer4 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer5 {
        0%, 10% { transform: translate(11.5px, -4.2px); }
        34%, 68% { transform: translate(72.0px, -26.0px); }
        90%, 100% { transform: translate(11.5px, -4.2px); }
      }
      .vca-l5 { animation: vcaLayer5 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }

      @keyframes vcaLayer6 {
        0%, 10% { transform: translate(17.9px, -6.4px); }
        34%, 68% { transform: translate(111.6px, -40.3px); }
        90%, 100% { transform: translate(17.9px, -6.4px); }
      }
      .vca-l6 { animation: vcaLayer6 8.5s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }
      @keyframes vcaRfPulse {
        0%, 100% { opacity: 0.15; transform: scale(0.85); }
        50% { opacity: 0.9; transform: scale(1.25); }
      }
      @keyframes vcaScanSweep {
        0% { transform: translateY(-170px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(170px); opacity: 0; }
      }
      @keyframes vcaOrbitBeacon {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .vca-rf-wave {
        transform-box: fill-box;
        transform-origin: center;
        animation: vcaRfPulse 2.4s ease-in-out infinite;
      }
      .vca-scan {
        animation: vcaScanSweep 4.2s linear infinite;
      }
      .vca-live-dot {
        animation: vcaOrbitBeacon 1.6s ease-in-out infinite;
      }
    </style>
    <pattern id="isoMinor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0C223B" stroke-width="0.6" />
    </pattern>
    <pattern id="isoMajor" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#isoMinor)" />
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#14375C" stroke-width="1.1" />
    </pattern>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24" />
      <stop offset="48%" stop-color="#0EA5E9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#040B16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Graphite Blueprint Canvas -->
  <rect width="1200" height="640" fill="#040B16" />
  <rect width="1200" height="640" fill="url(#isoMajor)" />
  <ellipse cx="420" cy="565" rx="340" ry="44" fill="url(#stageGlow)" />

  <!-- Outer CAD Drafting Sheet Border -->
  <rect x="16" y="16" width="1168" height="608" rx="8" fill="none" stroke="#1E3A5F" stroke-width="1.4" />
  <rect x="22" y="22" width="1156" height="596" rx="6" fill="none" stroke="#0F2640" stroke-width="0.9" />

  <!-- Top Telemetry Title Strip -->
  <circle cx="44" cy="48" r="5" fill="#10B981" class="vca-live-dot" />
  <text x="58" y="52" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.6">VCA — VERIFIED CARD AUTHORITY · LIVE 3D EXPLODED CAD PREVIEW</text>
  <text x="42" y="72" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PROTOTYPE VCA-26-00202 · Optical Polycarbonate (PC) · CLICK TO LAUNCH INTERACTIVE 3D VIEWPORT</text>

  <!-- Isometric Z-Axis Explosion Guide Line -->
  <line x1="191.79999999999998" y1="448.6" x2="645.4" y2="284.8" stroke="#1E3A5F" stroke-width="1.4" stroke-dasharray="6 5" />
  <text x="191.79999999999998" y="470.6" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">-Z REAR SHELL</text>
  <text x="577" y="297.5" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">+Z FRONT SHELL</text>

  <!-- Animated 3D Oblique Slab Assembly (7 Z-Axis Layers) -->
  <g transform="translate(415, 368) skewY(-13) scale(0.86, 1)">

    <!-- Layer 0: #12 Rear Optical Polycarbonate Shell -->
    <g class="vca-l0">
      <polygon points="-82.1,-169.1 82.1,-169.1 102.9,-157.6 102.9,145.1 79.0,169.1 -79.0,169.1 -102.9,145.1 -102.9,-157.6" fill="url(#glassGrad)" stroke="#38BDF8" stroke-width="1.8" />
      <polygon points="-79.1,-162.1 79.1,-162.1 95.9,-152.8 95.9,142.7 76.6,162.1 -76.6,162.1 -95.9,142.7 -95.9,-152.8" fill="none" stroke="#7DD3FC" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.65" />
      <text x="0" y="155.1" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">#12 REAR OPTICAL SHELL</text>
    </g>

    <!-- Layer 1: #11 Ultrasonic Energy Director + 4 Corner Shear Pins -->
    <g class="vca-l1">
      <polygon points="-79.1,-162.1 79.1,-162.1 95.9,-152.8 95.9,142.7 76.6,162.1 -76.6,162.1 -95.9,142.7 -95.9,-152.8" fill="rgba(56,189,248,0.06)" stroke="#7DD3FC" stroke-width="1.4" stroke-dasharray="8 4" />
      <circle cx="-86.9" cy="-135.1" r="4" fill="#38BDF8" />
      <circle cx="86.9" cy="-135.1" r="4" fill="#38BDF8" />
      <circle cx="-86.9" cy="145.1" r="4" fill="#38BDF8" />
      <circle cx="86.9" cy="145.1" r="4" fill="#38BDF8" />
      <text x="0" y="157.1" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">#11 20kHz WELD RIDGE + 4 PINS</text>
    </g>

    <!-- Layer 2: #10 Zero-Pinch Card Retention Cradle -->
    <g class="vca-l2">
      <polygon points="-78.1,-160.1 78.1,-160.1 93.9,-151.3 93.9,141.9 75.7,160.1 -75.7,160.1 -93.9,141.9 -93.9,-151.3" fill="rgba(15,23,42,0.45)" stroke="#60A5FA" stroke-width="1.4" />
      <rect x="-80.7" y="-77.5" width="161.5" height="223.7" rx="5" fill="rgba(4,18,36,0.65)" stroke="#38BDF8" stroke-width="1.3" />
      <text x="0" y="136.1" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">#10 RETENTION CRADLE</text>
    </g>

    <!-- Layer 3: #08 / #09 Archival Inner Sleeve + Encapsulated Trading Card -->
    <g class="vca-l3">
      <rect x="-81.8" y="-78.6" width="163.6" height="225.8" rx="4" fill="rgba(255,255,255,0.04)" stroke="#BAE6FD" stroke-width="0.9" stroke-dasharray="4 2" />
      <rect x="-77.8" y="-74.6" width="155.6" height="217.8" rx="3" fill="#090E1A" stroke="#E2E8F0" stroke-width="2.2" />
      <rect x="-65.8" y="-56.6" width="131.6" height="104.5" rx="2" fill="rgba(14,165,233,0.22)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="0" y="68.3" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">#09 CERTIFIED CARD</text>
      <text x="0" y="83.3" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">63.5 × 88.9 mm</text>
    </g>

    <!-- Layer 4: #04 / #05 / #06 / #07 VCA Blue/Red Certification Label + NFC Coil -->
    <g class="vca-l4">
      <!-- Classic VCA Blue (left) & Crimson Red (right) split frame -->
      <rect x="-88.2" y="-154.4" width="88.2" height="61.3" rx="4" fill="#0A2E73" />
      <rect x="0" y="-154.4" width="88.2" height="61.3" rx="4" fill="#B91C1C" />
      <rect x="-88.2" y="-154.4" width="176.4" height="61.3" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.4" />
      <!-- Pearl White Fugitive-Ink Insert -->
      <rect x="-83.7" y="-149.9" width="167.4" height="52.3" rx="2" fill="#F8FAFC" />
      <text x="-78.2" y="-129.7" fill="#090D16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">VCA-26-00202</text>
      <text x="-78.2" y="-117.7" fill="#1E293B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">VCA 10 · GEM MINT</text>
      <!-- Center Chrome VCA Seal -->
      <rect x="-15" y="-106.1" width="30" height="12" rx="2" fill="#CBD5E1" stroke="#0F3D99" stroke-width="1" />
      <text x="0" y="-97.1" text-anchor="middle" fill="#0F3D99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">VCA</text>
      <rect x="29.4" y="-150.7" width="53.9" height="53.9" rx="3" fill="rgba(245,158,11,0.12)" stroke="#F59E0B" stroke-width="1.3" />
      <rect x="33.7" y="-146.4" width="45.3" height="45.3" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" /><rect x="36.0" y="-144.0" width="40.6" height="40.6" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" /><rect x="38.4" y="-141.7" width="36.0" height="36.0" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" /><rect x="40.7" y="-139.4" width="31.3" height="31.3" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" /><rect x="43.1" y="-137.0" width="26.6" height="26.6" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" /><rect x="45.4" y="-134.7" width="21.9" height="21.9" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.3" opacity="0.95" />
      <rect x="51.9" y="-128.2" width="9" height="9" rx="1.5" fill="#F59E0B" />
      <!-- Pulsing 13.56 MHz RF Coupling Field Rings -->
      <circle cx="56.4" cy="-123.7" r="24" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="4 3" class="vca-rf-wave" />
      <circle cx="56.4" cy="-123.7" r="34" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 4" class="vca-rf-wave" />
    </g>

    <!-- Layer 5: #02 Water-Clear Polycarbonate Perimeter Frame -->
    <g class="vca-l5">
      <polygon points="-82.1,-169.1 82.1,-169.1 102.9,-157.6 102.9,145.1 79.0,169.1 -79.0,169.1 -102.9,145.1 -102.9,-157.6" fill="rgba(224,242,254,0.03)" stroke="#BAE6FD" stroke-width="3.2" opacity="0.55" />
      <polygon points="-79.1,-162.1 79.1,-162.1 95.9,-152.8 95.9,142.7 76.6,162.1 -76.6,162.1 -95.9,142.7 -95.9,-152.8" fill="none" stroke="#E0F2FE" stroke-width="1.1" opacity="0.85" />
      <text x="0" y="185.1" text-anchor="middle" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">#02 CLEAR OPTICAL PERIMETER FRAME</text>
    </g>

    <!-- Layer 6: #01 Front Crystal-Clear Optical Shell + Optical Scan Sweep -->
    <g class="vca-l6">
      <polygon points="-82.1,-169.1 82.1,-169.1 102.9,-157.6 102.9,145.1 79.0,169.1 -79.0,169.1 -102.9,145.1 -102.9,-157.6" fill="url(#glassGrad)" stroke="#E0F2FE" stroke-width="2" />
      <rect x="-94.9" y="-14" width="189.8" height="28" fill="url(#scanBeamGrad)" class="vca-scan" />
      <text x="0" y="199.1" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">#01 FRONT OPTICAL HOUSING (1.85 mm)</text>
    </g>

  </g>

  <!-- Right-Side Manufacturer Specification & Contact Card -->
  <rect x="780" y="96" width="386" height="504" rx="8" fill="rgba(6,17,32,0.94)" stroke="#1E3A5F" stroke-width="1.4" />
  <rect x="780" y="96" width="386" height="36" rx="8" fill="rgba(14,165,233,0.12)" />
  <text x="798" y="119" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">MANUFACTURING &amp; CAD REQUIREMENTS</text>

  <text x="798" y="156" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">EXTERIOR ENVELOPE (PROPOSED)</text>
  <text x="798" y="174" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">84.0 × 138.0 × 6.8 mm (±0.05)</text>

  <text x="798" y="204" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">OPTICAL POLYMER &amp; TOOL FINISH</text>
  <text x="798" y="222" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Optical Polycarbonate (PC)</text>
  <text x="798" y="239" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">SPI A-1 Polish Window · VDI 24–27 Matte Rim</text>

  <text x="798" y="269" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">ZERO-PINCH CAVITY &amp; ULTRASONIC SEAL</text>
  <text x="798" y="287" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Cavity: 65.9 × 91.3 × 0.66 mm</text>
  <text x="798" y="304" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">20 kHz Weld (0.75×0.55mm) + 4 Shear Pins</text>

  <text x="798" y="334" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">13.56 MHz NFC ACCESS HARDWARE</text>
  <text x="798" y="352" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">NTAG424 DNA · AES-128 SUN</text>
  <text x="798" y="369" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Spiral: 18.5×18.5 mm · 6T · 1.11 uH</text>

  <text x="798" y="399" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">MOULD SHRINKAGE &amp; CLAMP ESTIMATE</text>
  <text x="798" y="417" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">0.6% (84.504×138.828 mm tool)</text>
  <text x="798" y="434" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Est. Mass: 73.2 g · ~120 US Tons (2-Cav)</text>

  <line x1="798" y1="454" x2="1148" y2="454" stroke="#1E3A5F" stroke-width="1" />

  <!-- Contact Banner -->
  <rect x="798" y="468" width="350" height="72" rx="6" fill="rgba(14,165,233,0.12)" stroke="#38BDF8" stroke-width="1.1" />
  <text x="812" y="490" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">MANUFACTURER &amp; ENGINEERING CONTACT</text>
  <text x="812" y="512" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">tosmond@vcaslabs.com</text>
  <text x="812" y="530" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">vcaslabs.com · Formal DFM Confirmation Required</text>

  <!-- Interactive Launch Hint -->
  <text x="798" y="574" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">▶ CLICK PREVIEW TO ORBIT LIVE 3D CAD &amp; DOWNLOAD</text>
  <text x="798" y="590" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">Downloads: STL · DXF · OpenSCAD · BOM CSV · RFQ Spec</text>
</svg>